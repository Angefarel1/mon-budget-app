<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>TAF — Connexion</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:     #7c3aed;
      --primary-d:   #5b21b6;
      --primary-l:   #ede9fe;
      --primary-xl:  #f5f3ff;
      --mauve-300:   #c4b5fd;
      --mauve-200:   #ddd6fe;
      --text-1:      #1a1025;
      --text-2:      #3d2b5e;
      --text-3:      #6b5c8a;
      --text-4:      #9b8db0;
      --surface:     #ffffff;
      --bg:          #faf9ff;
      --bg-2:        #f3f0ff;
      --border:      #e8e2f8;
      --red:         #ef4444;
      --red-l:       #fef2f2;
      --green:       #10b981;
      --green-l:     #ecfdf5;
      --shadow:      0 4px 24px rgba(124,58,237,0.12);
      --shadow-lg:   0 12px 48px rgba(124,58,237,0.18);
      --radius:      12px;
      --radius-lg:   18px;
      --radius-xl:   24px;
      --transition:  0.2s cubic-bezier(0.4,0,0.2,1);
      --font:        'Sora', system-ui, sans-serif;
      --font-mono:   'DM Mono', monospace;
    }

    [data-theme="dark"] {
      --primary:     #a78bfa;
      --primary-d:   #c4b5fd;
      --primary-l:   #2d1f5e;
      --primary-xl:  #1e1535;
      --mauve-300:   #7c3aed;
      --text-1:      #f0ebff;
      --text-2:      #d4c8f5;
      --text-3:      #9f8cc9;
      --text-4:      #6b5c8a;
      --surface:     #1a1035;
      --bg:          #120c28;
      --bg-2:        #1e1540;
      --border:      #2d2050;
      --shadow:      0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg:   0 12px 48px rgba(0,0,0,0.5);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Background ── */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
    }
    .bg-mesh::before {
      content: '';
      position: absolute; top: -30%; right: -20%;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 65%);
      border-radius: 50%; animation: floatA 8s ease-in-out infinite;
    }
    .bg-mesh::after {
      content: '';
      position: absolute; bottom: -20%; left: -15%;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(196,181,253,0.12) 0%, transparent 65%);
      border-radius: 50%; animation: floatB 10s ease-in-out infinite;
    }
    @keyframes floatA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,20px)} }
    @keyframes floatB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-30px)} }

    /* ── Card ── */
    .auth-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      padding: 20px 16px;
      animation: slideIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(32px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }

    /* ── Logo ── */
    .auth-logo {
      text-align: center; margin-bottom: 8px;
    }
    .auth-logo-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px; border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), var(--mauve-300));
      font-family: var(--font); font-size: 1.6rem; font-weight: 800;
      color: #fff; letter-spacing: -2px;
      box-shadow: 0 8px 24px rgba(124,58,237,0.35);
      margin-bottom: 12px;
    }
    .auth-title {
      font-size: 1.5rem; font-weight: 800; color: var(--text-1);
      letter-spacing: -0.5px; margin-bottom: 4px;
    }
    .auth-subtitle {
      font-size: 0.82rem; color: var(--text-3); margin-bottom: 28px;
    }

    /* ── Tabs ── */
    .auth-tabs {
      display: flex; gap: 4px;
      background: var(--bg-2); border-radius: var(--radius);
      padding: 4px; margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1; padding: 9px 12px; border-radius: 10px;
      font-size: 0.82rem; font-weight: 700; color: var(--text-3);
      cursor: pointer; text-align: center;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .auth-tab.active {
      background: var(--surface); color: var(--primary);
      box-shadow: 0 2px 8px rgba(124,58,237,0.12);
    }

    /* ── Forms ── */
    .auth-form { display: none; }
    .auth-form.active { display: block; animation: fadeUp 0.3s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .field { margin-bottom: 16px; }
    .field-label {
      display: block; font-size: 0.75rem; font-weight: 700;
      color: var(--text-2); margin-bottom: 6px; letter-spacing: 0.3px;
    }
    .field-input {
      width: 100%; padding: 12px 14px;
      background: var(--bg-2); border: 1.5px solid var(--border);
      border-radius: var(--radius); font-size: 0.88rem; font-family: var(--font);
      color: var(--text-1); outline: none;
      transition: all var(--transition);
    }
    .field-input:focus {
      border-color: var(--primary);
      background: var(--primary-xl);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }
    .field-input.error { border-color: var(--red); background: var(--red-l); }
    .field-input::placeholder { color: var(--text-4); }

    .field-pw { position: relative; }
    .field-pw .field-input { padding-right: 44px; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 16px;
      color: var(--text-3); padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Error / Success ── */
    .auth-alert {
      padding: 10px 14px; border-radius: var(--radius);
      font-size: 0.8rem; font-weight: 600; margin-bottom: 16px;
      display: none; animation: fadeUp 0.25s ease both;
    }
    .auth-alert.error   { background: var(--red-l); color: var(--red); border: 1px solid #fecaca; display: block; }
    .auth-alert.success { background: var(--green-l); color: #065f46; border: 1px solid #a7f3d0; display: block; }

    /* ── Button ── */
    .btn-auth {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-d));
      color: #fff; border: none; border-radius: var(--radius);
      font-size: 0.92rem; font-weight: 700; font-family: var(--font);
      cursor: pointer; margin-top: 8px;
      transition: all var(--transition);
      box-shadow: 0 4px 16px rgba(124,58,237,0.3);
      position: relative; overflow: hidden;
    }
    .btn-auth::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(255,255,255,0);
      transition: background var(--transition);
    }
    .btn-auth:hover::after { background: rgba(255,255,255,0.08); }
    .btn-auth:active { transform: scale(0.98); }
    .btn-auth:disabled { opacity: 0.65; cursor: not-allowed; }

    /* ── Security badge ── */
    .auth-secure {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; margin-top: 20px;
      font-size: 0.72rem; color: var(--text-4); font-weight: 500;
    }
    .auth-secure span { font-size: 14px; }

    /* ── Lang selector (top right) ── */
    .lang-bar {
      display: flex; justify-content: flex-end; gap: 4px;
      margin-bottom: 12px;
    }
    .lang-btn {
      padding: 4px 10px; border-radius: 20px;
      background: var(--bg-2); border: 1.5px solid var(--border);
      font-size: 0.7rem; font-weight: 700; color: var(--text-3);
      cursor: pointer; transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .lang-btn.active { background: var(--primary-l); border-color: var(--primary); color: var(--primary); }
    .lang-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed; top: 16px; left: 16px; z-index: 100;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer; box-shadow: var(--shadow);
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .theme-toggle:hover { transform: scale(1.1); }

    /* ── Decorative dots ── */
    .auth-dots {
      display: flex; justify-content: center; gap: 6px; margin-top: 24px;
    }
    .auth-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--border); transition: all var(--transition);
    }
    .auth-dot.active { background: var(--primary); transform: scale(1.3); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px; }
    }

    /* ── RTL support ── */
    [dir="rtl"] .pw-toggle { right: auto; left: 12px; }
    [dir="rtl"] .field-pw .field-input { padding-right: 14px; padding-left: 44px; }
    [dir="rtl"] .lang-bar { justify-content: flex-start; }
  </style>
</head>
<body>

<!-- Background -->
<div class="bg-mesh"></div>

<!-- Theme toggle -->
<button class="theme-toggle" id="theme-toggle" title="Thème">🌙</button>

<div class="auth-wrap">

  <!-- Language selector -->
  <div class="lang-bar" id="lang-bar">
    <button class="lang-btn active" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="es">ES</button>
    <button class="lang-btn" data-lang="ar">AR</button>
    <button class="lang-btn" data-lang="pt">PT</button>
  </div>

  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-mark">TAF</div>
      <div class="auth-title" id="auth-title" data-i18n="auth_welcome">Bienvenue sur TAF</div>
      <div class="auth-subtitle" data-i18n="auth_subtitle">Gérez vos finances en toute sécurité</div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" data-i18n="auth_login">Se connecter</div>
      <div class="auth-tab" id="tab-register" data-i18n="auth_register">Créer un compte</div>
    </div>

    <!-- Alert -->
    <div class="auth-alert" id="auth-alert"></div>

    <!-- Login form -->
    <form class="auth-form active" id="form-login" autocomplete="on">
      <div class="field">
        <label class="field-label" data-i18n="auth_username">Nom d'utilisateur</label>
        <input type="text" id="login-username" class="field-input" data-i18n-ph="auth_username"
               placeholder="Nom d'utilisateur" autocomplete="username" spellcheck="false"/>
      </div>
      <div class="field">
        <label class="field-label" data-i18n="auth_password">Mot de passe</label>
        <div class="field-pw">
          <input type="password" id="login-password" class="field-input" data-i18n-ph="auth_password"
                 placeholder="Mot de passe" autocomplete="current-password"/>
          <button type="button" class="pw-toggle" data-target="login-password">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-auth" data-i18n="auth_btn_login">Se connecter</button>
    </form>

    <!-- Register form -->
    <form class="auth-form" id="form-register" autocomplete="off">
      <div class="field">
        <label class="field-label" data-i18n="auth_username">Nom d'utilisateur</label>
        <input type="text" id="reg-username" class="field-input" data-i18n-ph="auth_username"
               placeholder="Nom d'utilisateur" autocomplete="username" spellcheck="false"/>
      </div>
      <div class="field">
        <label class="field-label" data-i18n="auth_birthdate">Date de naissance</label>
        <input type="date" id="reg-birthdate" class="field-input"/>
      </div>
      <div class="field">
        <label class="field-label" data-i18n="auth_password">Mot de passe</label>
        <div class="field-pw">
          <input type="password" id="reg-password" class="field-input" data-i18n-ph="auth_password"
                 placeholder="Mot de passe" autocomplete="new-password"/>
          <button type="button" class="pw-toggle" data-target="reg-password">👁</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-i18n="auth_confirm_password">Confirmer le mot de passe</label>
        <div class="field-pw">
          <input type="password" id="reg-confirm" class="field-input" data-i18n-ph="auth_confirm_password"
                 placeholder="Confirmer le mot de passe" autocomplete="new-password"/>
          <button type="button" class="pw-toggle" data-target="reg-confirm">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-auth" data-i18n="auth_btn_register">Créer mon compte</button>
    </form>

    <!-- Security badge -->
    <div class="auth-secure">
      <span>🔒</span>
      <span data-i18n="auth_secure">Vos données restent sur votre appareil</span>
    </div>

    <!-- Dots indicator -->
    <div class="auth-dots">
      <div class="auth-dot active" id="dot-login"></div>
      <div class="auth-dot" id="dot-register"></div>
    </div>

  </div>
</div>

<script src="i18n.js"></script>
<script>
(function () {

  /* ── Auth storage ── */
  const KEYS = {
    user: 'taf_user',
    session: 'taf_session',
  };

  function saveUser(data) {
    localStorage.setItem(KEYS.user, JSON.stringify(data));
  }

  function getUser() {
    try { return JSON.parse(localStorage.getItem(KEYS.user)); } catch { return null; }
  }

  function createSession() {
    localStorage.setItem(KEYS.session, '1');
  }

  /* ── Redirect if already logged in ── */
  if (localStorage.getItem(KEYS.session)) {
    window.location.replace('index.html');
  }

  /* ── Theme ── */
  function applyTheme() {
    const dark = localStorage.getItem('taf_theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.getElementById('theme-toggle').textContent = dark ? '☀️' : '🌙';
  }
  applyTheme();
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    localStorage.setItem('taf_theme', isDark ? 'light' : 'dark');
    applyTheme();
  });

  /* ── Lang ── */
  function activateLang(lang) {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    TAFi18n.setLang(lang);
  }
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => activateLang(btn.dataset.lang));
  });
  activateLang(TAFi18n.getLang());

  /* ── Tabs ── */
  const tabLogin    = document.getElementById('tab-login');
  const tabRegister = document.getElementById('tab-register');
  const formLogin   = document.getElementById('form-login');
  const formReg     = document.getElementById('form-register');
  const dotLogin    = document.getElementById('dot-login');
  const dotReg      = document.getElementById('dot-register');

  function showTab(which) {
    const isLogin = which === 'login';
    tabLogin.classList.toggle('active', isLogin);
    tabRegister.classList.toggle('active', !isLogin);
    formLogin.classList.toggle('active', isLogin);
    formReg.classList.toggle('active', !isLogin);
    dotLogin.classList.toggle('active', isLogin);
    dotReg.classList.toggle('active', !isLogin);
    clearAlert();
  }

  tabLogin.addEventListener('click', () => showTab('login'));
  tabRegister.addEventListener('click', () => showTab('register'));

  /* ── Alert ── */
  const alertEl = document.getElementById('auth-alert');
  function showAlert(msg, type = 'error') {
    alertEl.textContent = msg;
    alertEl.className = 'auth-alert ' + type;
  }
  function clearAlert() {
    alertEl.className = 'auth-alert';
  }

  /* ── Password toggle ── */
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      if (!input) return;
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.textContent = isText ? '👁' : '🙈';
    });
  });

  /* ── Login ── */
  formLogin.addEventListener('submit', (e) => {
    e.preventDefault();
    clearAlert();
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    if (!username || !password) {
      showAlert(TAFi18n.tr('auth_error_required'));
      return;
    }

    const user = getUser();
    if (!user || user.username.toLowerCase() !== username.toLowerCase() || user.password !== password) {
      showAlert(TAFi18n.tr('auth_error_wrong'));
      document.getElementById('login-password').classList.add('error');
      return;
    }

    showAlert(TAFi18n.tr('auth_success_login'), 'success');
    createSession();
    setTimeout(() => window.location.replace('index.html'), 800);
  });

  /* ── Register ── */
  formReg.addEventListener('submit', (e) => {
    e.preventDefault();
    clearAlert();
    const username  = document.getElementById('reg-username').value.trim();
    const birthdate = document.getElementById('reg-birthdate').value;
    const password  = document.getElementById('reg-password').value;
    const confirm   = document.getElementById('reg-confirm').value;

    // Clear error states
    ['reg-username','reg-birthdate','reg-password','reg-confirm'].forEach(id => {
      document.getElementById(id).classList.remove('error');
    });

    if (!username || !birthdate || !password || !confirm) {
      showAlert(TAFi18n.tr('auth_error_required'));
      return;
    }

    if (password !== confirm) {
      showAlert(TAFi18n.tr('auth_error_passwords'));
      document.getElementById('reg-password').classList.add('error');
      document.getElementById('reg-confirm').classList.add('error');
      return;
    }

    // Check if user already exists
    const existing = getUser();
    if (existing) {
      showAlert(TAFi18n.tr('auth_error_exists'));
      document.getElementById('reg-username').classList.add('error');
      return;
    }

    // Save new user
    saveUser({ username, birthdate, password, createdAt: new Date().toISOString() });
    createSession();
    showAlert(TAFi18n.tr('auth_success_register'), 'success');
    setTimeout(() => window.location.replace('index.html'), 900);
  });

  /* ── If user already exists, auto-show login ── */
  if (getUser()) {
    showTab('login');
  }

  /* ── Input error clear on focus ── */
  document.querySelectorAll('.field-input').forEach(input => {
    input.addEventListener('focus', () => {
      input.classList.remove('error');
      clearAlert();
    });
  });

})();
</script>
</body>
</html>
