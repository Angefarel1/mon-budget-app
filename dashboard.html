<!DOCTYPE html>
<html lang="fr">
<head>
  <script>(function(s){s.dataset.zone='10956470',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>TAF - Tableau de bord budget, dépenses et statistiques financières</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .chart-card { padding: 18px; }
    .donut-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
    .donut-center {
      position: absolute; text-align: center; pointer-events: none;
    }
    .donut-total { font-family: var(--font-head); font-size: 1.2rem; font-weight: 800; }
    .donut-label { font-size: 0.68rem; color: var(--text-3); }
    .legend { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .legend-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-name { font-size: 0.82rem; color: var(--text-2); flex: 1; }
    .legend-val  { font-size: 0.82rem; font-weight: 600; }
    .legend-pct  { font-size: 0.72rem; color: var(--text-3); width: 32px; text-align: right; }

    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .kpi-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 16px;
    }
    .kpi-label { font-size: 0.72rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
    .kpi-val   { font-family: var(--font-head); font-size: 1.2rem; font-weight: 700; }
    .kpi-sub   { font-size: 0.72rem; color: var(--text-3); margin-top: 3px; }
    .kpi-trend { font-size: 0.75rem; font-weight: 600; margin-top: 4px; }
    .trend-up   { color: var(--red); }
    .trend-down { color: var(--primary); }

    .bar-chart-wrap { padding: 4px 0; }
    canvas { display: block; width: 100% !important; }

    .month-selector { display: flex; align-items: center; gap: 10px; }
    .month-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--bg-2); border: 1px solid var(--border); color: var(--text-2); font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition); }
    .month-btn:hover { background: var(--primary-l); color: var(--primary-d); }
    .month-label { font-size: 0.9rem; font-weight: 600; flex: 1; text-align: center; }

    .top-cat-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .top-cat-item:last-child { border-bottom: none; }
    .tc-rank { font-family: var(--font-head); font-size: 1rem; font-weight: 700; color: var(--text-4); width: 20px; }
    .tc-info { flex: 1; }
    .tc-name { font-size: 0.88rem; font-weight: 600; }
    .tc-bar-wrap { height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden; margin-top: 5px; }
    .tc-bar-fill { height: 100%; background: var(--primary); border-radius: 2px; }
    .tc-amount { font-size: 0.88rem; font-weight: 700; font-family: var(--font-head); }
  </style>
</head>
<body>

<nav class="top-nav">
  <div class="top-nav-inner">
    <div class="nav-logo">T<span>AF</span></div>
    <nav class="desktop-nav">
      <a href="app.html"       data-page="app">🏠 Accueil</a>
      <a href="dashboard.html" data-page="dashboard" class="active">📊 Stats</a>
      <a href="history.html"   data-page="history">📜 Historique</a>
      <a href="settings.html"  data-page="settings">⚙️ Réglages</a>
    </nav>
    <div class="nav-actions">
      <button class="nav-btn" id="btn-export" title="Exporter CSV">📤</button>
      <button class="nav-btn" id="btn-theme">🌙</button>
    </div>
  </div>
</nav>

<main class="page-content">
  <div class="container" style="padding-top:24px">

    <!-- Month selector -->
    <div class="card mb-20">
      <div class="flex items-center justify-between mb-16">
        <span class="sec-title" id="label-monthly-stats">Stats mensuelles</span>
        <div class="month-selector">
          <button class="month-btn" id="btn-prev-month">‹</button>
          <span class="month-label" id="month-label">—</span>
          <button class="month-btn" id="btn-next-month">›</button>
        </div>
      </div>
      <!-- KPI Grid -->
      <div class="kpi-grid" id="kpi-grid"></div>
    </div>

    <!-- Donut chart -->
    <div class="card chart-card mb-20">
      <div class="sec-header">
        <span class="sec-title" id="label-breakdown">Répartition</span>
        <span class="badge badge-green" id="badge-month">Ce mois</span>
      </div>
      <div class="donut-wrap" style="height:210px">
        <canvas id="donut-canvas" width="210" height="210" style="max-width:210px"></canvas>
        <div class="donut-center">
          <div class="donut-total" id="donut-total">—</div>
          <div class="donut-label" id="label-total-spent">Total</div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <!-- Bar chart (weekly) -->
    <div class="card chart-card mb-20">
      <div class="sec-header">
        <span class="sec-title" id="label-weekly">Cette semaine</span>
      </div>
      <div class="bar-chart-wrap">
        <canvas id="bar-canvas" width="400" height="150" style="height:150px"></canvas>
      </div>
      <div class="flex justify-between mt-8">
        <span class="text-sm text-muted" id="label-avg">Moy. quotidienne</span>
        <span class="text-sm font-600" id="val-daily-avg">—</span>
      </div>
    </div>

    <!-- Top categories -->
    <div class="card mb-20">
      <div class="sec-header">
        <span class="sec-title" id="label-top-cat">Top catégories</span>
      </div>
      <div id="top-categories"></div>
    </div>

    <!-- Objectives progress -->
    <div class="card mb-20">
      <div class="sec-header">
        <span class="sec-title" id="label-obj-progress">Progression des objectifs</span>
      </div>
      <div id="dash-objectives"></div>
    </div>

  </div>
</main>

<nav class="bottom-nav">
  <div class="bnav-item" data-page="app" data-href="app.html">
    <span class="bnav-icon">🏠</span><span>Accueil</span><div class="bnav-dot"></div>
  </div>
  <div class="bnav-item active" data-page="dashboard" data-href="dashboard.html">
    <span class="bnav-icon">📊</span><span>Stats</span><div class="bnav-dot"></div>
  </div>
  <div class="bnav-item" data-page="history" data-href="history.html">
    <span class="bnav-icon">📜</span><span>Historique</span><div class="bnav-dot"></div>
  </div>
  <div class="bnav-item" data-page="settings" data-href="settings.html">
    <span class="bnav-icon">⚙️</span><span>Réglages</span><div class="bnav-dot"></div>
  </div>
</nav>

<div id="toast-container"></div>
<script src="auth-guard.js"></script>
<script src="script.js"></script>
<script>TAFAuth.injectLogoutBtn(".nav-actions");</script>
<script>
(function() {
  const CAT_COLORS = ['#8b5cf6','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#64748b'];

  let viewMonth = thisMonth(); // 'YYYY-MM'

  function init() {
    setActiveNav('dashboard');
    updateThemeBtn();
    updateMonthLabel();
    renderAll();
    attachEvents();
  }

  function updateThemeBtn() {
    document.getElementById('btn-theme').textContent = Store.getSettings().theme === 'dark' ? '☀️' : '🌙';
  }

  function updateMonthLabel() {
    const [y, m] = viewMonth.split('-');
    const d = new Date(parseInt(y), parseInt(m)-1, 1);
    const lang = Store.getSettings().language || 'fr';
    document.getElementById('month-label').textContent = d.toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-US', { month:'long', year:'numeric' });
  }

  function getMonthExpenses() {
    return Expenses.getAll().filter(e => e.date && e.date.startsWith(viewMonth));
  }

  function renderAll() {
    renderKPIs();
    renderDonut();
    renderBarChart();
    renderTopCategories();
    renderObjectives();
  }

  function renderKPIs() {
    const s      = Store.getSettings();
    const exps   = getMonthExpenses();
    const total  = exps.reduce((sum, e) => sum + e.amount, 0);
    const inc    = parseFloat(s.income) || 0;
    const budget = parseFloat(s.budget) || 0;
    const bal    = inc - total;
    const savRate= inc > 0 ? Math.max(0, (bal/inc)*100) : 0;
    const exRate = inc > 0 ? Math.min(100, (total/inc)*100) : 0;
    const budgUsed= budget > 0 ? Math.min(100,(total/budget)*100) : 0;
    const avgDay = exps.length > 0 ? total / new Date(parseInt(viewMonth.split('-')[0]), parseInt(viewMonth.split('-')[1]), 0).getDate() : 0;

    const grid = document.getElementById('kpi-grid');
    grid.innerHTML = `
      <div class="kpi-card">
        <div class="kpi-label">${t('expenses')}</div>
        <div class="kpi-val text-red">${formatCurrency(total)}</div>
        <div class="kpi-sub">${exps.length} transaction${exps.length!==1?'s':''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">${t('balance')}</div>
        <div class="kpi-val" style="color:${bal>=0?'var(--primary)':'var(--red)'}">${formatCurrency(bal)}</div>
        <div class="kpi-sub">${t('income')}: ${formatCurrency(inc)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">${t('savings_rate')}</div>
        <div class="kpi-val text-green">${savRate.toFixed(1)}%</div>
        <div class="kpi-sub">${t('expense_ratio')}: ${exRate.toFixed(0)}%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">${t('avg_daily')}</div>
        <div class="kpi-val">${formatCurrency(avgDay)}</div>
        <div class="kpi-sub">${t('budget')}: ${budgUsed.toFixed(0)}%</div>
      </div>
    `;
  }

  function renderDonut() {
    const exps = getMonthExpenses();
    const total = exps.reduce((s,e) => s+e.amount, 0);
    const bycat = {};
    exps.forEach(e => { bycat[e.category] = (bycat[e.category]||0) + e.amount; });
    const sorted = Object.entries(bycat).sort((a,b)=>b[1]-a[1]);

    document.getElementById('donut-total').textContent = formatCurrency(total);
    document.getElementById('label-total-spent').textContent = t('total_spent');

    const data = sorted.map(([cat, val]) => ({ label: cat, value: val }));
    Charts.drawDonut('donut-canvas', data, CAT_COLORS);

    const legend = document.getElementById('legend');
    if (!sorted.length) { legend.innerHTML = `<p class="text-sm text-muted text-center">${t('no_data')}</p>`; return; }
    legend.innerHTML = sorted.map(([cat, val], i) => {
      const catCfg = getCatConfig(cat);
      const pct = total > 0 ? Math.round((val/total)*100) : 0;
      return `<div class="legend-item">
        <div class="legend-dot" style="background:${CAT_COLORS[i%CAT_COLORS.length]}"></div>
        <span class="legend-name">${catCfg.icon} ${t(catCfg.key)}</span>
        <span class="legend-val">${formatCurrency(val)}</span>
        <span class="legend-pct">${pct}%</span>
      </div>`;
    }).join('');
  }

  function renderBarChart() {
    const days   = ['L','M','M','J','V','S','D'];
    const now    = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay() + 1);
    const vals   = [];
    const labels = [];
    for (let i = 0; i < 7; i++) {
      const d  = new Date(weekStart); d.setDate(weekStart.getDate() + i);
      const ds = d.toISOString().split('T')[0];
      const sum= Expenses.getAll().filter(e=>e.date===ds).reduce((s,e)=>s+e.amount,0);
      vals.push(sum);
      labels.push(days[i]);
    }
    Charts.drawBars('bar-canvas', labels, vals, 'var(--primary)');
    const avg = vals.reduce((s,v)=>s+v,0) / 7;
    document.getElementById('val-daily-avg').textContent = formatCurrency(avg);
  }

  function renderTopCategories() {
    const exps  = getMonthExpenses();
    const total = exps.reduce((s,e)=>s+e.amount,0);
    const bycat = {};
    exps.forEach(e => { bycat[e.category] = (bycat[e.category]||0)+e.amount; });
    const sorted = Object.entries(bycat).sort((a,b)=>b[1]-a[1]).slice(0,5);

    const el = document.getElementById('top-categories');
    if (!sorted.length) { el.innerHTML = `<p class="text-sm text-muted text-center">${t('no_data')}</p>`; return; }
    el.innerHTML = sorted.map(([cat,val],i) => {
      const catCfg = getCatConfig(cat);
      const pct = total>0 ? Math.round((val/total)*100) : 0;
      return `<div class="top-cat-item">
        <span class="tc-rank">#${i+1}</span>
        <div class="icon-circle ${catCfg.class}" style="width:36px;height:36px;font-size:16px">${catCfg.icon}</div>
        <div class="tc-info">
          <div class="tc-name">${t(catCfg.key)}</div>
          <div class="tc-bar-wrap"><div class="tc-bar-fill" style="width:${pct}%;background:${CAT_COLORS[i%CAT_COLORS.length]}"></div></div>
        </div>
        <span class="tc-amount">${formatCurrency(val)}</span>
      </div>`;
    }).join('');
  }

  function renderObjectives() {
    const objs = Objectives.getAll();
    const el   = document.getElementById('dash-objectives');
    if (!objs.length) { el.innerHTML = `<p class="text-sm text-muted text-center">${t('no_data')}</p>`; return; }
    el.innerHTML = objs.map(o => {
      const pct = o.target>0 ? Math.min(100, Math.round((o.saved/o.target)*100)) : 0;
      return `<div style="padding:12px 0;border-bottom:1px solid var(--border)">
        <div class="flex justify-between mb-8">
          <span class="font-600">${o.name}</span>
          <span class="text-sm font-600 text-green">${pct}%</span>
        </div>
        <div class="progress-bar mb-4"><div class="progress-fill" style="width:${pct}%;background:var(--primary)"></div></div>
        <div class="flex justify-between">
          <span class="text-xs text-muted">${formatCurrency(o.saved)}</span>
          <span class="text-xs text-muted">${formatCurrency(o.target)}</span>
        </div>
      </div>`;
    }).join('');
  }

  function prevMonth() {
    const [y,m] = viewMonth.split('-').map(Number);
    const d = new Date(y, m-2, 1);
    viewMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    updateMonthLabel(); renderAll();
  }
  function nextMonth() {
    const [y,m] = viewMonth.split('-').map(Number);
    const d = new Date(y, m, 1);
    const now = new Date();
    if (d > now) return;
    viewMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    updateMonthLabel(); renderAll();
  }

  function attachEvents() {
    document.getElementById('btn-theme').addEventListener('click', () => { Theme.toggle(); updateThemeBtn(); });
    document.getElementById('btn-export').addEventListener('click', exportCSV);
    document.getElementById('btn-prev-month').addEventListener('click', prevMonth);
    document.getElementById('btn-next-month').addEventListener('click', nextMonth);
  }

  init();
})();
</script>
</body>
</html>
